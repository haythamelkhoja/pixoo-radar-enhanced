# Pixoo Radar - Docker Compose
#
#   cp .env.example .env      # then set PIXOO_HOST, HOME_LAT, HOME_LON, GIF_BASE_URL
#   docker compose up -d
#   docker compose logs -f
#
# Open http://<this-host>:8765 to see what the Pixoo is showing.

services:
  radar:
    image: ghcr.io/haythamelkhoja/pixoo-radar-enhanced:latest
    container_name: pixoo-radar
    env_file: .env
    ports:
      - "8765:8765"   # plain-http GIF server the Pixoo fetches from (keep in sync with WEB_PORT)
    volumes:
      - pixoo-radar-data:/data   # history, with HISTORY=sqlite or csv in .env
    restart: unless-stopped

volumes:
  pixoo-radar-data:
