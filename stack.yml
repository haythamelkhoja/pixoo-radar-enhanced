# Pixoo Radar - Docker Swarm stack
#
# Deploy:           docker stack deploy -c stack.yml pixooradar
# Update:           docker service update --image ghcr.io/haythamelkhoja/pixoo-radar-enhanced:<version> pixooradar_radar
#                   (versions: https://github.com/haythamelkhoja/pixoo-radar-enhanced/releases)
# Logs:             docker service logs -f pixooradar_radar
# See the screen:   http://<any-swarm-node>:8765 shows what the Pixoo is showing
#
# Every setting is an environment variable; see docs/configuration.md for the full list.
#
# No "Loading.." screen: the Pixoo fetches each animation straight from the app on the
# published port 8765. No reverse proxy is involved, deliberately - the Pixoo can't do
# TLS and won't follow an http->https redirect, which is what most proxies answer with.
# The app resolves the GIF_BASE_URL hostname (any swarm node, where 8765 is published
# too) and hands the Pixoo the IP. The Pixoo's network must be allowed to reach the
# swarm nodes on TCP 8765. If it can't fetch, the app pushes frames instead (with
# "Loading..") and says why in the logs.
#
# Port 8765 serves the browser view as well, over plain http. If you want it on a
# hostname with TLS, put your proxy in front of *that* page only and leave
# GIF_BASE_URL pointing at the node's own :8765 - see docs/deployment.md.

version: "3.8"

services:
  radar:
    image: ghcr.io/haythamelkhoja/pixoo-radar-enhanced:latest
    environment:
      PIXOO_HOST: 192.168.1.50          # IP or hostname of your Pixoo64
      HOME_LAT: "51.4700"               # your location
      HOME_LON: "-0.4543"
      RADAR_RADIUS_KM: "100"
      REFRESH_SECONDS: "60"             # how often to look for the closest flight
      COLOR_BOX: "#2B2B2B"
      GIF_BASE_URL: "http://192.168.1.20:8765"   # a swarm node's address, plus GIF_PORT
      GIF_PORT: "8765"
      TZ: Europe/London
    ports:
      - target: 8765                    # plain-http GIF server the Pixoo fetches from
        published: 8765
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 1                       # only one instance should drive the Pixoo
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 30s
